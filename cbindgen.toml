language = "C"

header = """
/*
 * SPDX-License-Identifier: LGPL-3.0-or-later
 *
 * Generated by cbindgen.
 * DO NOT EDIT.
 */
"""

include_guard = "WINDOWS_H"

autogen_warning = "/* Warning, this file is generated by cbindgen. */"

usize_is_size_t = true

[parse]
parse_deps = false
features = ["c-bindings"]
